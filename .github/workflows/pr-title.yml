name: PR Title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          pattern='^(feat|fix|perf|refactor|docs|test|ci|chore|build|style|revert)\([a-z0-9][a-z0-9.-]*\)!?: .+'

          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title is conventional: $PR_TITLE"
            exit 0
          fi

          cat <<'MSG' >&2
          PR title must follow Conventional Commits because Release Please uses merged PR titles to decide release notes.

          Required format:
            type(scope): short summary

          Examples:
            feat(orchestrator): add environment-aware delegation
            fix(installer): preserve existing agent configuration
            docs(workflows): clarify validation steps
            ci(release): update release automation

          Allowed types:
            feat, fix, perf, refactor, docs, test, ci, chore, build, style, revert
          MSG
          echo "Actual title: $PR_TITLE" >&2
          exit 1

name: Repository validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: quokkify/project-toolkit/.github/workflows/python-ci.yml@v2.7.2
    with:
      python-version: "3.14"
      package-manager: pip
      install-command: python -m pip install zensical==0.0.24
      lint-command: ./scripts/validate.sh --ci
      run-tests: false
      cache-dependencies: false
